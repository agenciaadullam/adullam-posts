name: Gerar audio
on:
  push:
    paths: ['audio/**/falas.txt', 'audio/**/voz.txt', 'audio/sfx.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install edge-tts
      - name: Gerar
        run: |
          for f in audio/*/falas.txt; do
            d=$(dirname "$f")
            h=$(cat "$d/falas.txt" "$d/voz.txt" | sha1sum | cut -c1-12)
            if [ "$(cat "$d/.hash" 2>/dev/null)" != "$h" ]; then
              python _sistema/gerar_audio.py "$d" && echo "$h" > "$d/.hash"
            fi
          done
      - name: Salvar
        run: |
          git config user.name "adullam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Audio gerado"
          git push
