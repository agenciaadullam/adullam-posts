name: Gerar audio
on:
  push:
    paths: ['audio/**/falas.txt', 'audio/**/voz.txt', 'audio/sfx.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install edge-tts
      - name: Gerar
        run: |
          for d in $(git diff --name-only HEAD~1 HEAD | grep -E 'audio/.+/(falas|voz)\.txt' | xargs -r -n1 dirname | sort -u); do
            python _sistema/gerar_audio.py "$d"
          done
      - name: Salvar
        run: |
          git config user.name "adullam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Audio gerado"
          git push
